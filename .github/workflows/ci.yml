name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: make check (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install jsonschema (the one dev dependency)
        run: python -m pip install --quiet jsonschema
      - name: make check
        run: make check

  renderer:
    name: renderer build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build and test the A2UI renderer
        working-directory: renderer
        run: |
          npm ci
          npm run build
          git diff --exit-code dist/index.html
          npm test
